# ============================================================
# Funding Radar config — tune this, not the code.
# ============================================================

gmail_folder: "INBOX"        # or a Gmail label, e.g. "Alerts"
max_links_per_email: 15
max_telegram_per_run: 12
keep_opportunities: 400

# Set true once your field terms are dialled in. Cuts noise hard,
# but will drop anything phrased unusually. Start false.
require_field_match: false

# false (default): LEVEL alone is enough to survive — postgrad postings
# with no funding/fee-waiver language still get through, just scored lower
# than funded ones (see FUNDING below). This is what surfaces plain
# "applications open"/deadline announcements, not just funded positions.
# true: reverts to LEVEL *and* FUNDING both required.
require_funding_match: false

# ------------------------------------------------------------
# An item must always hit LEVEL. FUNDING is an extra required gate only
# when require_funding_match is true above — otherwise it just adds score.
# ------------------------------------------------------------

level_terms:
  - phd
  - doctoral
  - doctorate
  - msc
  - m.sc
  - master
  - masters
  - graduate program
  - graduate programme
  - postgraduate
  - mphil

funding_terms:
  - fully funded
  - full funding
  - fully-funded
  - scholarship
  - fellowship
  - stipend
  - bursary
  - tuition waiver
  - tuition fee waiver
  - funded position
  - funded phd
  - salaried
  - assistantship
  - studentship
  - grant
  - no tuition
  - covers tuition

# ------------------------------------------------------------
# YOUR FIELD. Replace these with your actual subfield terms —
# this is the single highest-leverage edit in the whole repo.
# ------------------------------------------------------------

field_terms:
  - engineering
  - computer science
  - machine learning
  - artificial intelligence
  - data science
  - materials
  - mechanical
  - electrical
  - civil engineering
  - chemical engineering
  - renewable energy
  - robotics
  - physics
  - mathematics
  - biomedical

# ------------------------------------------------------------
# Kill list. Postdoc and undergrad noise is the bulk of it.
# ------------------------------------------------------------

exclude_terms:
  - postdoc
  - post-doc
  - postdoctoral
  - undergraduate scholarship
  - high school
  - webinar
  - summer camp
  - your application was
  - password
  - verify your email

