name: Funding Radar

on:
  schedule:
    # Hourly. ~720 runs/month — comfortably inside the free tier
    # on a private repo, and unlimited on a public one.
    - cron: "17 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand

permissions:
  contents: write           # needed to commit the dedupe state back

concurrency:
  group: funding-radar
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: python watcher.py

      - name: Persist state
        run: |
          git config user.name  "funding-radar"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "radar: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
